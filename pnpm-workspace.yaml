packages:
  - packages/*
  - tooling/*

# Install only versions published at least 7 days ago (10080 minutes).
minimumReleaseAge: 10080
# autd is our own package, so all its versions skip the wait (DECISIONS D14).
minimumReleaseAgeExclude:
  - "@pixel-perfect-software/always-up-to-date"
  - "@turbo/darwin-64@2.11.11"
  - "@turbo/darwin-arm64@2.11.11"
  - "@turbo/linux-64@2.11.11"
  - "@turbo/linux-arm64@2.11.11"
  - "@turbo/windows-64@2.11.11"
  - "@turbo/windows-arm64@2.11.11"
  - turbo@2.11.11

# Jest 30's haste map and resolver ship prebuilt native bindings; their install scripts only
# rebuild from source when a prebuilt binary is missing, so they never run here.
allowBuilds:
  "@parcel/watcher": false
  # @swc/core's postinstall only checks that its platform binary installed.
  "@swc/core": false
  unrs-resolver: false

# Exact pins, shared by every package that uses them: reference with "catalog:".
# Pin the newest version that is at least 7 days old on the day you install it.
catalog:
  # The hoist corpus runs Jest's real plugin through Babel (T3.4); the recorder's `jestEsm`
  # fixtures add Babel's CJS output, which a real ESM-syntax Jest project has in some form.
  "@babel/core": 7.29.7
  "@babel/plugin-transform-modules-commonjs": 7.29.7
  # The hoist corpus runs Jest's JSX case as upstream's test does.
  "@babel/preset-react": 7.29.7
  # T3.8's fixture: babel-jest needs a TypeScript preset to read the test.
  "@babel/preset-typescript": 7.29.7
  # T1.6: package correctness. attw checks how each pack resolves under every module system.
  "@arethetypeswrong/cli": 0.18.5
  "@biomejs/biome": 2.6.5
  # T1.6: changesets 3 version the public packages; `pnpm hygiene` checks a changeset exists.
  "@changesets/cli": 3.0.3
  # The Jest dialect's expect (B08): the leaves the vendored matchers import, at exactly the
  # versions expect@30.5.2 depends on (DECISIONS D18).
  "@jest/expect-utils": 30.5.2
  "@jest/get-type": 30.5.0
  # Jest 30.5 and Vitest 5.0: subjects of the dev packages (harness, bench), never our runner.
  "@edge-runtime/jest-environment": 4.0.0
  "@jest/globals": 30.5.2
  "@jest/test-result": 30.5.2
  # The Spike A loader fixture's Jest baseline uses @swc/jest (Track 2, bench-e2e).
  "@swc/core": 1.16.22
  "@swc/jest": 0.2.39
  # Type tests only: real Jest transformers must assign to JestTransformer (Track 3, T3.1).
  "@jest/transform": 30.5.2
  # Coverage's instrumenter (B23b, D110) reads Jest's own `instrumenter` defaults from the schema:
  # the version Jest 30.5.2's babel-plugin-istanbul installs (D109).
  "@istanbuljs/schema": 0.1.6
  # Source-map composition in @provino/transform (Track 3 R1), and in @provino/coverage's instrumenter.
  "@jridgewell/remapping": 2.3.5
  # The hoister's map probes: every moved statement traces back to its line and column (T3.4);
  # @provino/coverage's instrumenter reads input maps with it.
  "@jridgewell/trace-mapping": 0.3.31
  # autd: dependency updates (DECISIONS D14); config in .always-up-to-date.json.
  "@pixel-perfect-software/always-up-to-date": 4.1.1
  # The current-test propagation test (Track 5 Spikes B): fake-timer callbacks, as Jest 30.5 installs.
  "@sinonjs/fake-timers": 15.4.0
  "@standard-schema/spec": 1.1.0
  # istanbul-lib-coverage ships no types; the version @jest/test-result uses.
  "@types/istanbul-lib-coverage": 2.0.6
  "@types/jsdom": 30.0.0
  # Node 22.15 is the floor, so type against the 22.x API.
  "@types/node": 22.20.5
  # picomatch ships no types (D26).
  "@types/picomatch": 4.0.3
  "@types/sinonjs__fake-timers": 15.0.1
  # Interop tests only: our asymmetric matchers inside Vitest's expect, and its inside ours (T7.4).
  "@vitest/expect": 5.0.5
  # The hoist corpus's Vitest reference: its real hoister at the pinned version (T3.4).
  "@vitest/mocker": 5.0.5
  # The mock bench's bar: calls within 1.5x of @vitest/spy (T4.3).
  "@vitest/spy": 5.0.5
  # T1.6: the API reports (`@public` / `@beta` / `@internal` tiers, Track 1 §Types and public API).
  "@microsoft/api-extractor": 7.60.1
  # The TypeScript 6 API, as tsc6, for tools that need it (dependency-cruiser, API Extractor).
  "@typescript/typescript6": 6.0.2
  # The recorder's Jest transform runs after type stripping (Jest's default transform).
  babel-jest: 30.5.2
  # The Istanbul instrumenter's oracle (B23b, T8.10): the plugin babel-jest runs under `--coverage`.
  babel-plugin-istanbul: 8.0.0
  # The hoist corpus's Jest reference: the plugin babel-jest runs (T3.4).
  babel-plugin-jest-hoist: 30.5.0
  # date-fns, lodash and zod: libraries the generated bench suites import (Track 12 R5).
  date-fns: 4.4.0
  dependency-cruiser: 18.7.2
  # The Spike A loader fixture's shared node_modules (Track 2): ESM, CJS, ESM + wasm, and expect.
  es-module-lexer: 3.0.4
  expect: 30.5.2
  expect-type: 1.4.0
  jest: 30.5.2
  # Jest's own config code, called inside recorded fixtures for the defaults no run shows (D27), by
  # the Jest dialect's defaults check (T11.2), and as the Jest config reader's oracle (B14b): real
  # `readConfig` / `readInitialOptions`, in-process. The version `jest@30.5.2` installs.
  jest-config: 30.5.2
  # The Jest CLI parser's oracle (T11.7, B14c): `buildArgv` and `yargsOptions`, in-process. The
  # version `jest@30.5.2` installs.
  jest-cli: 30.5.2
  # jest-matcher-utils, jest-message-util and jest-util: the Jest dialect's expect (D18, above).
  jest-matcher-utils: 30.5.2
  jest-message-util: 30.5.1
  # The mock bench's second baseline (T4.3), and the Jest dialect's upstream expect tests.
  jest-mock: 30.5.2
  # A real `print`-style snapshot serializer: the snapshot corpus runs it under both runners (T7.10).
  # T8.5's smoke: the Jest environment packages the adapter runs with no source change. Two jsdom
  # lines (jest 30's, and 29.7 through an alias), the fixed-globals subclass, and the edge runtime.
  jest-environment-jsdom: 30.5.2
  jest-environment-jsdom-29: npm:jest-environment-jsdom@29.7.0
  jest-environment-node: 30.5.2
  jest-fixed-jsdom: 0.0.11
  jest-serializer-vue: 3.1.0
  jest-util: 30.5.1
  # jsdom (Track 8's version): the propagation test's DOM rows, later the jsdom environment.
  jsdom: 30.1.3
  # The bottom of the `jsdom` peer range (>=26 <31): env-jsdom's userAgent test runs against it too.
  jsdom-26: npm:jsdom@26.1.0
  # Coverage data and its merge: the version Jest 30.5.2's reporters install (D109).
  istanbul-lib-coverage: 3.2.2
  # The initial-coverage oracle (B23b, T8.10): what Jest's CoverageReporter runs on untested files.
  istanbul-lib-instrument: 6.0.3
  # T1.6: unused files, exports and dependencies.
  knip: 6.44.1
  # T8.2's second window: happy-dom's `GlobalWindow`, populated and restored by env-shared.
  happy-dom: 21.0.4
  lodash: 4.18.1
  # The hoister's edits and maps (Track 3 R2), and the Spike A loader fixture.
  magic-string: 1.4.5
  # The oracle for the vendored key order in @provino/snapshot (T7.9): same pairs, same order.
  natural-compare: 1.4.0
  # Oxc (Track 3): the resolver, and the transform pipeline with its parser.
  # `@oxc-project/types` moves with oxc-parser: it is oxc-walker's optional peer, and without it
  # oxc-walker takes rolldown's older copy, so its AST types differ from the parser's.
  "@oxc-project/types": 0.157.0
  oxc-parser: 0.157.0
  oxc-resolver: 11.24.2
  oxc-transform: 0.157.0
  # The hoister's AST walk and scope tracking (Track 3 R2).
  oxc-walker: 1.1.1
  # Discovery matches `testMatch` on absolute paths with ordered negation, as Jest's
  # `globsToMatcher` does (DECISIONS D26): a runtime dependency of `@provino/orchestrator`.
  picomatch: 4.0.7
  pretty-format: 30.5.1
  # T1.6: package.json `exports` and file-layout lint, run on every `pnpm pack`.
  publint: 0.3.25
  # File discovery in the coordinator (B11): include/exclude globs.
  tinyglobby: 0.2.17
  # T3.8's rebuilt fixture runs the real ts-jest 29 (on TypeScript 5.9.3) beside babel-jest and @swc/jest.
  ts-jest: 29.4.15
  tsdown: 0.23.5
  turbo: 2.11.11
  typescript: 7.0.2
  # The type-test job also runs on TypeScript 5.9.
  typescript-5.9: npm:typescript@5.9.3
  # Jest 30.5 and Vitest 5.0 are the ground truth every golden records (CLAUDE.md NN2, DECISIONS
  # S3), so `.always-up-to-date.json` holds both families: moving one is a re-record, not an update.
  vitest: 5.0.5
  # libxml2 compiled to WebAssembly (MIT): the JUnit reporter's test validates its output against
  # the vendored Jenkins XSD with it (T9.7), so local runs and CI use one validator and need no
  # system xmllint. A devDependency of @provino/reporters only.
  xmllint-wasm: 5.3.0
  zod: 4.6.7

# dependency-cruiser loads `typescript` at runtime to parse .ts files, and 18.7 can't use the
# TypeScript 7 API yet (Track 1 §Spikes). Give it the TypeScript 6 API under that name.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
