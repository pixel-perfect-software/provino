packages:
  - packages/*
  - tooling/*

# Install only versions published at least 7 days ago (10080 minutes).
minimumReleaseAge: 10080
# Our own packages skip the wait (DECISIONS D14).
minimumReleaseAgeExclude:
  - "@pixel-perfect-software/always-up-to-date"
  # autd 3.3.0 pins @inquirer/prompts 8.7.5. These exact versions were published 2026-10-27
  # and clear the 7-day wait on 2026-11-03; Tyler approved installing them early. Later
  # versions still wait. Remove these lines after 2026-11-03.
  - "@inquirer/ansi@2.0.10"
  - "@inquirer/checkbox@5.2.8"
  - "@inquirer/confirm@6.3.5"
  - "@inquirer/core@12.0.6"
  - "@inquirer/editor@5.3.6"
  - "@inquirer/expand@5.1.8"
  - "@inquirer/external-editor@3.0.7"
  - "@inquirer/figures@2.0.10"
  - "@inquirer/input@5.1.9"
  - "@inquirer/number@4.2.6"
  - "@inquirer/password@5.2.5"
  - "@inquirer/prompts@8.7.5"
  - "@inquirer/rawlist@5.3.8"
  - "@inquirer/search@4.3.6"
  - "@inquirer/select@5.2.8"
  - "@inquirer/type@4.2.1"

# Exact pins, shared by every package that uses them: reference with "catalog:".
# Pin the newest version that is at least 7 days old on the day you install it.
catalog:
  "@biomejs/biome": 2.6.3
  # autd: dependency updates (DECISIONS D14); config in .always-up-to-date.json.
  "@pixel-perfect-software/always-up-to-date": 3.3.0
  "@standard-schema/spec": 1.1.0
  # Node 22.15 is the floor, so type against the 22.x API.
  "@types/node": 22.20.5
  # The TypeScript 6 API, as tsc6, for tools that need it (dependency-cruiser, API Extractor).
  "@typescript/typescript6": 6.0.2
  dependency-cruiser: 18.7.0
  expect-type: 1.4.0
  tsdown: 0.23.2
  turbo: 2.11.10
  typescript: 7.0.2
  # The type-test job also runs on TypeScript 5.9.
  typescript-5.9: npm:typescript@5.9.3

# dependency-cruiser loads `typescript` at runtime to parse .ts files, and 18.7 can't use the
# TypeScript 7 API yet (Track 1 §Spikes). Give it the TypeScript 6 API under that name.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
