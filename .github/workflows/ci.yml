name: CI

# A task branch's push run already reports its checks on the PR's commit, so its PR doesn't run
# them again (PR runs use a different ref, so the concurrency group can't cancel a duplicate):
# every job skips a `pull_request` run whose head is a `task/**` branch. Any other PR head
# (Dependabot, a hand-named branch) still gets a full run.
on:
  push:
    branches: [main, "task/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Typecheck and test (Node ${{ matrix.node }})
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'task/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The supported floor. Node strips types by default only from 22.18, so this leg
          # turns it on (DECISIONS S1). Turbo passes NODE_OPTIONS through to the tests.
          - node: 22.15.0
            node-options: --experimental-strip-types
          - node: "24"
            node-options: ""
          - node: "26"
            node-options: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Restore the Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ matrix.node }}-
      # The crash tests kill a worker with SIGSEGV and must see it die at once. The runner pipes
      # core dumps to a crash handler, and the kernel ignores `ulimit -c` for a pipe, so each
      # crashing worker first streams its whole memory image: 48-185 s per crash test in run
      # 42072223325. A plain file pattern with core files off ends a crashed worker as locally.
      - name: Turn core dumps off
        run: |
          echo "core_pattern was: $(cat /proc/sys/kernel/core_pattern)"
          echo core | sudo tee /proc/sys/kernel/core_pattern || echo "::warning::could not change core_pattern; crash tests will be slow"
      - run: ulimit -c 0 && pnpm test
        env:
          NODE_OPTIONS: ${{ matrix.node-options }}

  type-tests:
    name: Type tests (TypeScript ${{ matrix.typescript }})
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'task/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - typescript: 7.0.2
            script: test:types
          - typescript: 5.9.3
            script: test:types:ts5.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}

  lint:
    name: Lint, format and boundaries
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'task/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - id: install
        run: pnpm install --frozen-lockfile
      # Each check runs even when an earlier one failed, so one run reports every problem.
      - run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      # Manifest vs workspace vs generated config, then dependency-cruiser (DECISIONS D11).
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm boundaries

  suites:
    name: Bench suites and recorded goldens (Jest 30.5, Vitest 5.0)
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'task/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the branch can be diffed against main below.
          fetch-depth: 0
      # The suite checks take about 11 of this job's 12 minutes, and their result depends only on
      # the generator and check code (bench, and the harness helpers it uses), the runners'
      # versions (lockfile, catalog), Node (.tool-versions), the root scripts and this workflow.
      # The app-500 and mock-heavy-500 checks also run Provino itself (`--runner provino`), so they
      # depend on the source and manifest of every package a Provino run might load: any workspace package's
      # `src/` or `package.json`, so a package that starts to be loaded later needs no edit here.
      # Unit tests beside that source (`*.test.ts`, `*.test-d.ts`) are not loaded by a run, so
      # editing one alone doesn't count; bench and harness keep counting them. The harness
      # self-test also reads its sample and recording (`packages/harness/sample/`).
      # Each check runs on main, and on a task branch whose changes against main touch its inputs
      # (`.github/actions/scope`, which fails closed).
      - id: scope
        name: Decide whether the suite checks run
        uses: ./.github/actions/scope
        with:
          label: the suite checks
          include: '^(packages/bench/|packages/harness/src/|packages/harness/sample/|packages/[^/]+/(src/|package\.json$)|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.tool-versions$|package\.json$|\.github/(workflows/ci\.yml|actions/scope/))'
          exclude: '^packages/[^/]+/src/.*\.test(-d)?\.ts$'
          keep: "^packages/(bench|harness)/"
      # What `record --check` reads (B14a): the recorder and every fixture, the runners' versions,
      # Node and the root scripts. A dialect's values aren't one: `policy-truth.test.ts` holds them
      # to the committed goldens in `pnpm test`.
      - id: goldens
        name: Decide whether the goldens are re-recorded
        uses: ./.github/actions/scope
        with:
          label: the goldens check
          include: '^(packages/harness/(src/|fixtures/|package\.json$)|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.tool-versions$|package\.json$|\.github/(workflows/ci\.yml|actions/scope/))'
      # What the Node 22 mocking check reads: the recorder and its fixtures, the runners' versions,
      # Node and the root scripts. The engine isn't one: this records real Jest and Vitest.
      - id: mocking
        name: Decide whether the mocking goldens are checked on Node 22
        uses: ./.github/actions/scope
        with:
          label: the Node 22 mocking check
          include: '^(packages/harness/(src/|fixtures/mocking/|package\.json$)|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.tool-versions$|package\.json$|\.github/(workflows/ci\.yml|actions/scope/))'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - id: install
        run: pnpm install --frozen-lockfile
      # Every generated suite must pass under both real runners (Track 12 T12.12). app-500 and
      # mock-heavy-500 (B13c) also run Provino (the `provino` bin, as a black box, all cores but one):
      # every test passes, its normalized-json parses, and each test's status equals Jest's (B11).
      - if: ${{ steps.scope.outputs.run == 'true' }}
        run: pnpm provino-bench check app-500 --runner jest --runner vitest --runner provino
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.run == 'true' }}
        run: pnpm provino-bench check mock-heavy-500 --runner jest --runner vitest --runner provino
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.run == 'true' }}
        run: pnpm provino-bench check isolate-heavy --runner jest --runner vitest
      # Re-record every fixture and fail if a golden drifted (.claude/rules/tests.md).
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.goldens.outputs.run == 'true' }}
        run: pnpm provino-harness record --check
      # The harness self-test (Track 12 T12.6, T12.16): the sample under real Jest and Vitest, its
      # recording, the sidecars and the calibrated parity, then Provino (the `provino` bin) as a
      # subject. It prints pass or fail per check and no Provino number, because these logs are
      # public; the parity report goes to --out only when asked for, which this step doesn't.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.run == 'true' }}
        run: pnpm provino-harness self-test --candidate provino
      # T4.1: the mocking goldens regenerate byte-identically on the oldest Node we support. Below
      # 22.18 the recorder takes type stripping from NODE_OPTIONS (DECISIONS S1). Last in this job,
      # because it changes the Node every later step would run on.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.mocking.outputs.run == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.mocking.outputs.run == 'true' }}
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: pnpm record:mocking --check

  jest-oracles:
    name: Jest config reader against real presets (jest-config 30.5)
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'task/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the branch can be diffed against main below.
          fetch-depth: 0
      # T11.5: ts-jest, React Native, jest-expo, jest-preset-angular and a relative preset, read by
      # ours and by real jest-config, equal on the 55 keys (B14b). The check installs about 850
      # packages, and its result depends only on the Jest dialect (all of it: `/node` imports `.`,
      # and the oracle presets and type tests live there), what the reader loads (config, resolver,
      # policy, types), the bench command and the harness modules it runs children with, the
      # runners' versions (lockfile, catalog), Node, the root scripts, this workflow and the scope
      # action. It runs on main, and on a task branch whose changes against main touch any of
      # those (`.github/actions/scope`, which fails closed, as the suites job's checks do);
      # `packages/bench/src/jest-config/jest-config.test.ts` checks the paths it covers.
      - id: scope
        name: Decide whether the oracle check runs
        uses: ./.github/actions/scope
        with:
          label: the oracle check
          include: '^(packages/dialect-jest/|packages/harness/(src/|package\.json$)|packages/bench/(src/jest-config/|package\.json$)|packages/(config|resolver|policy|types)/(src/|package\.json$)|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.tool-versions$|package\.json$|\.github/(workflows/ci\.yml|actions/scope/))'
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - if: ${{ steps.scope.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile
      # The presets are their own pnpm root, pinned by their own lockfile, outside the workspace.
      - if: ${{ steps.scope.outputs.run == 'true' }}
        run: pnpm --dir packages/dialect-jest/oracle/presets install --frozen-lockfile
      - if: ${{ steps.scope.outputs.run == 'true' }}
        run: pnpm bench:jest-config presets

  corpora:
    name: Resolver and transform corpora (Node ESM agreement, excalidraw)
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'task/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - id: install
        run: pnpm install --frozen-lockfile
      # T3.2: our resolver agrees with Node's ESM resolution on every installed package's entry
      # points (bar: >=531 compared, >=529/531 agreement). Timings are checked locally only.
      - run: pnpm bench:resolve
      # T3.5: every manifest file of excalidraw at the pinned commit transforms with 0 errors.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        name: Fetch excalidraw at the manifest's commit
        run: |
          commit=$(node -p "require('./packages/transform/fixtures/excalidraw.json').commit")
          mkdir -p .refs/excalidraw
          curl -sSfL "https://codeload.github.com/excalidraw/excalidraw/tar.gz/$commit" \
            | tar -xz -C .refs/excalidraw --strip-components=1
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm bench:excalidraw
      # T2.4: 10,000 generated TS files through the pipeline and the guarded module-runner transform,
      # with no process abort and every failure reported per file.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm bench:runner-fuzz
      # T3.13: our module-runner transform is AST-equal to oxc's on the fuzz, excalidraw and scoping
      # corpora (or on the exemption list). Its speed is checked locally only.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm bench:runner-diff --skip-speed
